tomcat.URIEncoding = UTF-8
tomcat.useBodyEncodingForURI = true
#tomcat.secure=false
#tomcat.scheme=http
#tomcat.bindAddress=127.0.0.1
#tomcat.proxyPort=
#tomcat.maxHttpHeaderSize=4096
# SameSite attribute for cookies (lax|strict|none). Lax keeps redirect-based (GET) SSO
# callbacks working. A callback delivered as a cross-site POST -- SAML's HTTP-POST binding,
# or Entra ID with response_mode=form_post -- does not carry a Lax cookie, so those setups
# need `none`, which in turn requires HTTPS and session.cookie.secure=true.
tomcat.sameSiteCookies = lax
# Compression (gzip) of the scripts, styles and SVG files of 1 KB or more. Set `off` when a reverse
# proxy in front of Fess compresses the responses already.
#tomcat.compression=on
# Pages and JSON are not compressed: the size of a compressed response can reveal the session token
# an admin page contains. Add their types (comma-separated) to compress them as well.
#tomcat.compression.mime=text/html,application/json
