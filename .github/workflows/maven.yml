# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches:
    - main
    - "*.x"
  # No branch filter: `pull_request.branches` matches the BASE branch, so restricting it to
  # main/*.x means a stacked pull request - one whose base is the previous branch in the
  # stack - gets no CI at all. `push` keeps its filter so feature-branch pushes do not
  # double-build.
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PARENT_BRANCH: main
      # Must match configsync.config_path inside the service container, because Fess embeds this
      # path in the analyzers' *_path settings and configsync writes the dictionaries there.
      FESS_DICTIONARY_PATH: /usr/share/opensearch/config/dictionary
    timeout-minutes: 20
    # Fess no longer bundles a search engine, so the workflow starts one. This image is the
    # official OpenSearch distribution plus the four CodeLibs plugins, built by docker-fess.
    services:
      opensearch:
        image: ghcr.io/codelibs/fess-opensearch:3.8.0
        env:
          discovery.type: single-node
          cluster.name: fess-search
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          DISABLE_SECURITY_PLUGIN: "true"
          FESS_DICTIONARY_PATH: /usr/share/opensearch/config/dictionary
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
        - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 60s
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Checkout fess-parent
      uses: actions/checkout@v4
      with:
        repository: codelibs/fess-parent
        ref: ${{ env.PARENT_BRANCH }}
        path: fess-parent
    - name: Install fess-parent
      run: |
        cd fess-parent
        mvn install -Dgpg.skip=true
    - name: Download Plugins with Maven
      run: mvn -B antrun:run --file pom.xml
    - name: Build with Maven
      run: mvn -B source:jar javadoc:jar package --file pom.xml -Dparallel=classes -DthreadCount=4 -DforkCount=1C -DreuseForks=true
    - name: Run Fess
      run: bash src/test/resources/before_script.sh
    - name: Run Integration Test
      run: bash src/test/resources/run.sh

